name: Export LLM History Backfill

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/export_llm_backfill.py"
      - ".github/workflows/export-llm-backfill.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Restore private crawl history
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/posts.jsonl
          key: cvs-posts-${{ github.run_id }}
          restore-keys: |
            cvs-posts-

      - name: Require crawl history from cache
        run: |
          # posts.jsonl is gitignored and tracked in no branch, so there is no
          # seed fallback: the only source is the cvs-posts-* Actions cache. A
          # miss means that cache has expired or was never seeded — fail loudly
          # with the documented recovery path.
          if [ ! -s data/posts.jsonl ]; then
            echo "::error::No crawl history restored from the cvs-posts-* Actions cache." >&2
            echo "Run seed-cache.yml using docs/runbook-data-recovery.md," >&2
            echo "then re-run this workflow." >&2
            exit 1
          fi
          echo "Restored $(wc -l < data/posts.jsonl) posts from cache"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Export account-free unlabeled comments
        run: |
          python scripts/export_llm_backfill.py \
            --posts data/posts.jsonl \
            --out artifacts/unlabeled-comments.csv

      - name: Upload private labeling artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: llm-history-backfill-${{ github.run_id }}
          path: artifacts/unlabeled-comments.csv
          if-no-files-found: error
          retention-days: 7
