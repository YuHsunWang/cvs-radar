<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系統架構</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', 'Noto Sans TC', sans-serif; background: #f5f5f5; color: #2d3142;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    svg { width: 100%; min-width: 900px; display: block; }
    .n  { font-family: 'Geist', 'Noto Sans TC', sans-serif; font-size: 16px; font-weight: 600; fill: #2d3142; }
    .s  { font-family: 'Geist', 'Noto Sans TC', sans-serif; font-size: 12px; fill: #4f5d75; }
    .m  { font-family: 'Geist Mono', 'Noto Sans TC', monospace; font-size: 12px; fill: #4f5d75; }
    .t  { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.08em; }
    .z  { font-family: 'Geist Mono', 'Noto Sans TC', monospace; font-size: 12px; letter-spacing: 0.08em; fill: #7a8399; }
    .h  { font-family: 'Instrument Serif', 'Noto Sans TC', serif; font-size: 28px; fill: #2d3142; }
  </style>
</head>
<body>
<div class="frame">
<svg viewBox="0 0 1280 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cvs-arch-title cvs-arch-desc">
  <title id="cvs-arch-title">系統架構：批次管線與靜態發佈</title>
  <desc id="cvs-arch-desc">本機排程依序爬取 PTT、以五層 LLM 標記、評分並合併官方營養標示建置前端資料，commit 回 main 後部署為靜態網站。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="56" class="h">系統架構：批次管線與靜態發佈</text>

  <!-- zones -->
  <rect x="24" y="104" width="988" height="400" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="36" y="96" width="316" height="16" rx="2" fill="#f5f5f5"/>
  <text x="44" y="108" class="z">本機每日排程 · scripts/ops/rebackfill.sh</text>
  <rect x="1024" y="104" width="232" height="216" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <rect x="1036" y="96" width="132" height="16" rx="2" fill="#f5f5f5"/>
  <text x="1044" y="108" class="z">push main 觸發部署</text>

  <!-- arrows (before nodes) -->
  <line x1="240" y1="224" x2="284" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="488" y1="224" x2="532" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="736" y1="224" x2="780" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="984" y1="224" x2="1036" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="992" y="196" width="36" height="12" rx="2" fill="#f5f5f5"/>
  <text x="1010" y="205" class="t" fill="#7a8399" text-anchor="middle">COMMIT</text>
  <line x1="884" y1="384" x2="884" y2="300" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <rect x="896" y="332" width="84" height="16" rx="2" fill="#f5f5f5"/>
  <text x="900" y="344" class="s">失敗沿用快取</text>

  <!-- 1 crawl -->
  <rect x="40" y="152" width="200" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="56" y="172" class="t" fill="rgba(45,49,66,0.6)">01 · CRAWL</text>
  <text x="140" y="204" class="n" text-anchor="middle">爬取</text>
  <text x="140" y="232" class="s" text-anchor="middle">PTT CVS 板貼文與留言</text>
  <text x="140" y="256" class="m" text-anchor="middle">crawl_job.py</text>
  <text x="140" y="276" class="m" text-anchor="middle">data/posts.jsonl</text>

  <!-- 2 LLM labels (focal) -->
  <rect x="288" y="152" width="200" height="144" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="304" y="172" class="t" fill="#eb6c36">02 · LABEL</text>
  <text x="388" y="204" class="n" text-anchor="middle">LLM 標記（五層）</text>
  <text x="388" y="228" class="s" text-anchor="middle">情緒 · 商品名 · 心得摘句</text>
  <text x="388" y="244" class="s" text-anchor="middle">代表留言 · 分類</text>
  <text x="388" y="264" class="m" text-anchor="middle">TypeSafe Jev · Codex</text>
  <text x="388" y="282" class="m" text-anchor="middle">data/labels/*.csv</text>

  <!-- 3 scoring -->
  <rect x="536" y="152" width="200" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="552" y="172" class="t" fill="rgba(45,49,66,0.6)">03 · SCORE</text>
  <text x="636" y="204" class="n" text-anchor="middle">評分</text>
  <text x="636" y="232" class="s" text-anchor="middle">貝氏收斂 · 單人設限</text>
  <text x="636" y="256" class="m" text-anchor="middle">cvs_radar/pipeline.py</text>
  <text x="636" y="276" class="m" text-anchor="middle">data/results.json</text>

  <!-- 4 build data -->
  <rect x="784" y="152" width="200" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="800" y="172" class="t" fill="rgba(45,49,66,0.6)">04 · BUILD</text>
  <text x="884" y="204" class="n" text-anchor="middle">前端資料建置</text>
  <text x="884" y="232" class="s" text-anchor="middle">商品層級欄位 · 營養標示</text>
  <text x="884" y="256" class="m" text-anchor="middle">web/build_data.py</text>
  <text x="884" y="276" class="m" text-anchor="middle">web/public/data.json</text>

  <!-- official nutrition (external) -->
  <rect x="764" y="388" width="240" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="780" y="408" class="t" fill="rgba(45,49,66,0.5)">EXTERNAL</text>
  <text x="884" y="428" class="n" text-anchor="middle">官方營養標示 · 7-11 / 全家</text>
  <text x="884" y="452" class="m" text-anchor="middle">fetch_official_kcal.py</text>
  <text x="884" y="472" class="m" text-anchor="middle">fetch_official_nutrition.py</text>

  <!-- 5 static site -->
  <rect x="1040" y="152" width="200" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1056" y="172" class="t" fill="rgba(45,49,66,0.6)">05 · SITE</text>
  <text x="1140" y="204" class="n" text-anchor="middle">靜態網站</text>
  <text x="1140" y="232" class="s" text-anchor="middle">搜尋篩選在瀏覽器完成</text>
  <text x="1140" y="256" class="m" text-anchor="middle">Next.js 15 匯出</text>
  <text x="1140" y="276" class="m" text-anchor="middle">Vercel · GitHub Pages</text>

  <!-- legend -->
  <line x1="40" y1="520" x2="1240" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="548" class="t" fill="#4f5d75" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="536" width="20" height="16" rx="4" fill="#ffffff" stroke="#2d3142"/>
  <text x="148" y="548" class="s">管線步驟</text>
  <rect x="240" y="536" width="20" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
  <text x="268" y="548" class="s">語意判讀核心（指紋快取，只重標新內容）</text>
  <rect x="528" y="536" width="20" height="16" rx="4" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)"/>
  <text x="556" y="548" class="s">外部官方資料</text>
  <line x1="660" y1="544" x2="700" y2="544" stroke="#4f5d75" stroke-dasharray="4,3"/>
  <text x="708" y="548" class="s">選用輸入</text>
</svg>
</div>
</body>
</html>
