<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心得變參考</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Geist', 'Noto Sans TC', sans-serif; background: #f5f5f5; color: #2d3142;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    svg { width: 100%; min-width: 900px; display: block; }
    .n  { font-family: 'Geist', 'Noto Sans TC', sans-serif; font-size: 16px; font-weight: 600; fill: #2d3142; }
    .s  { font-family: 'Geist', 'Noto Sans TC', sans-serif; font-size: 12px; fill: #4f5d75; }
    .t  { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.08em; }
    .h  { font-family: 'Instrument Serif', 'Noto Sans TC', serif; font-size: 28px; fill: #2d3142; }
  </style>
</head>
<body>
<div class="frame">
<svg viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cvs-flow-title cvs-flow-desc">
  <title id="cvs-flow-title">一篇心得，如何變成購買參考？</title>
  <desc id="cvs-flow-desc">五個階段：收集 PTT 公開文章、整理成同一商品、判讀心得與留言情緒、彙整共識與時效、回到原文查證。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <text x="40" y="56" class="h">一篇心得，如何變成購買參考？</text>

  <!-- arrows -->
  <line x1="240" y1="184" x2="284" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="488" y1="184" x2="532" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="736" y1="184" x2="780" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="984" y1="184" x2="1036" y2="184" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 1 -->
  <rect x="40" y="104" width="200" height="160" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <text x="56" y="124" class="t" fill="rgba(45,49,66,0.6)">01 · SOURCE</text>
  <text x="140" y="160" class="n" text-anchor="middle">公開文章</text>
  <text x="140" y="192" class="s" text-anchor="middle">PTT CVS 板</text>
  <text x="140" y="212" class="s" text-anchor="middle">商品文與留言</text>

  <!-- 2 -->
  <rect x="288" y="104" width="200" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="304" y="124" class="t" fill="rgba(45,49,66,0.6)">02 · PRODUCT</text>
  <text x="388" y="160" class="n" text-anchor="middle">商品整理</text>
  <text x="388" y="192" class="s" text-anchor="middle">辨識通路 · 品名 · 價格</text>
  <text x="388" y="212" class="s" text-anchor="middle">合併同商品的不同名稱</text>

  <!-- 3 (focal) -->
  <rect x="536" y="104" width="200" height="160" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="552" y="124" class="t" fill="#eb6c36">03 · SEMANTICS</text>
  <text x="636" y="160" class="n" text-anchor="middle">語意判讀</text>
  <text x="636" y="192" class="s" text-anchor="middle">心得改寫成可回溯摘要</text>
  <text x="636" y="212" class="s" text-anchor="middle">留言分正向 · 中立 · 負向</text>
  <text x="636" y="232" class="s" text-anchor="middle">排除離題、純附和</text>
  <text x="636" y="252" class="s" text-anchor="middle">與其他通路的內容</text>

  <!-- 4 -->
  <rect x="784" y="104" width="200" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="800" y="124" class="t" fill="rgba(45,49,66,0.6)">04 · CONSENSUS</text>
  <text x="884" y="160" class="n" text-anchor="middle">共識彙整</text>
  <text x="884" y="192" class="s" text-anchor="middle">同一人不因重複留言放大</text>
  <text x="884" y="212" class="s" text-anchor="middle">樣本不足不給分</text>
  <text x="884" y="232" class="s" text-anchor="middle">近期推薦 · 討論熱度</text>

  <!-- 5 -->
  <rect x="1040" y="104" width="200" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1056" y="124" class="t" fill="rgba(45,49,66,0.6)">05 · EVIDENCE</text>
  <text x="1140" y="160" class="n" text-anchor="middle">快速查證</text>
  <text x="1140" y="192" class="s" text-anchor="middle">卡片先給快速摘要</text>
  <text x="1140" y="212" class="s" text-anchor="middle">展開看作者評價</text>
  <text x="1140" y="232" class="s" text-anchor="middle">代表留言與原文連結</text>

  <!-- legend -->
  <line x1="40" y1="296" x2="1240" y2="296" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="324" class="t" fill="#4f5d75" letter-spacing="0.14em">LEGEND</text>
  <rect x="120" y="312" width="20" height="16" rx="4" fill="rgba(79,93,117,0.10)" stroke="#7a8399"/>
  <text x="148" y="324" class="s">資料來源</text>
  <rect x="240" y="312" width="20" height="16" rx="4" fill="#ffffff" stroke="#2d3142"/>
  <text x="268" y="324" class="s">處理階段</text>
  <rect x="360" y="312" width="20" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
  <text x="388" y="324" class="s">關鍵：把留言變成可信的判讀</text>
</svg>
</div>
</body>
</html>
